<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Outside-the-Box Thinking Certification: a satirical exam that rewards lateral thinking. Pass it and earn your certificate." />
    <meta name="theme-color" content="#f2ebda" />
    <title>Outside-the-Box Thinking Certification</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://outside-the-box-game.web.app/" />
    <meta property="og:title" content="Outside-the-Box Thinking Certification" />
    <meta property="og:description" content="A 50-item exam where every obvious answer is a trap. Pass it and earn your certificate." />
    <meta property="og:image" content="https://outside-the-box-game.web.app/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An Outside-the-Box diploma beside the question: Can you pass?" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./assets/Logo.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f2ebda;
      }

      #main {
        width: 100vw;
        height: 100vh;
      }

      #game-window {
        position: relative;
        width: 100vw;
        height: 100vh;
        margin: 0;
        top: 0;
        left: 0;
      }

      #game-canvas,
      #die-canvas,
      #text-canvas,
      #debug-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }

      #die-canvas,
      #text-canvas,
      #debug-canvas {
        pointer-events: none;
      }

      #die-canvas {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div id="game-window">
        <canvas id="game-canvas"></canvas>
        <canvas id="die-canvas"></canvas>
        <canvas id="text-canvas"></canvas>
        <canvas id="debug-canvas"></canvas>
      </div>

      <div id="stats" hidden>
        <canvas id="stats-canvas"></canvas>
        <select name="Display" id="chart-option"></select>
        <div id="stats-display"></div>
      </div>
    </div>

    <script src="final.bundle.js"></script>
  </body>
</html>
